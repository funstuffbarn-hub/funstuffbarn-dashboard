{% extends "base.html" %}

{% block page_title %}{{ filename }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="bi bi-lightning-charge me-2"></i>{{ filename }}</h1>
    <a href="/prompts" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i> Volver
    </a>
</div>

<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span class="badge bg-primary-subtle text-primary">{{ path }}</span>
        <a href="/prompts/{{ path }}/download" class="btn btn-sm btn-outline-primary">
            <i class="bi bi-download me-1"></i> Descargar .docx
        </a>
    </div>
    <div class="card-body">
        <pre class="mb-0" style="font-size: 0.875rem; line-height: 1.6; white-space: pre-wrap; font-family: 'Monaco', 'Menlo', 'Ubuntu Mono', monospace;">{{ content }}</pre>
    </div>
</div>
{% endblock %}
