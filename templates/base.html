<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block page_title %}Dashboard{% endblock %} - FunStuffBarn</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="/static/css/dashboard.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/">
                <i class="bi bi-shop-window me-2"></i>FunStuffBarn Dashboard
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path == '/' %}active{% endif %}" href="/">
                            <i class="bi bi-speedometer2 me-1"></i> Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path.startswith('/reports') and not request.url.path.startswith('/reports/') %}active{% endif %}" href="/reports">
                            <i class="bi bi-file-earmark-text me-1"></i> Reportes
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path.startswith('/prompts') %}active{% endif %}" href="/prompts">
                            <i class="bi bi-lightning-charge me-1"></i> Prompts
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path.startswith('/disenos') %}active{% endif %}" href="/disenos">
                            <i class="bi bi-images me-1"></i> Diseños
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path.startswith('/secrets') %}active{% endif %}" href="/secrets">
                            <i class="bi bi-key me-1"></i> Secrets
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if request.url.path.startswith('/monitoring') %}active{% endif %}" href="/monitoring">
                            <i class="bi bi-graph-up me-1"></i> Monitoring
                        </a>
                    </li>
                </ul>
                <div class="navbar-text text-muted small">
                    <span id="currentTime"></span>
                </div>
            </div>
        </div>
    </nav>

    <main class="container-fluid pt-5 pb-4" style="padding-top: 70px;">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer mt-auto py-3 bg-light border-top">
        <div class="container-fluid text-center text-muted small">
            FunStuffBarn Agent-Etsy Dashboard v2.0 | 
            <a href="https://github.com" target="_blank" class="text-muted">GitHub</a> |
            Última actualización: <span id="lastUpdate">—</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/dashboard.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
