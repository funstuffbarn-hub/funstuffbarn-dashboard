{% extends "base.html" %}

{% block page_title %}Prompts Archive{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h1><i class="bi bi-lightning-charge me-2"></i>Prompts Archive</h1>
    <div class="d-flex gap-2">
        <input type="text" class="form-control form-control-sm" style="width: 300px;" id="promptSearch" placeholder="Buscar prompts...">
        <select class="form-select form-select-sm" style="width: auto;" id="categoryFilter">
            <option value="">Todas las categorías</option>
            {% for cat in categories %}
            <option value="{{ cat }}">{{ cat }}</option>
            {% endfor %}
        </select>
    </div>
</div>

<div class="card">
    <div class="card-body p-0">
        <div class="table-responsive">
            <table class="table table-hover mb-0" id="promptsTable">
                <thead class="table-light">
                    <tr>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Tamaño</th>
                        <th>Modificado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    {% for p in prompts %}
                    <tr data-category="{{ p.category }}" data-name="{{ p.name|lower }}">
                        <td>
                            <strong>{{ p.name }}</strong>
                        </td>
                        <td>
                            <span class="badge bg-secondary-subtle text-secondary">{{ p.category }}</span>
                        </td>
                        <td>{{ p.size_kb }} KB</td>
                        <td class="text-muted small">{{ p.modified }}</td>
                        <td>
                            <div class="btn-group btn-group-sm">
                                <a href="/prompts/{{ p.relative_path }}/view" class="btn btn-outline-primary">
                                    <i class="bi bi-eye"></i>
                                </a>
                                <a href="/prompts/{{ p.relative_path }}/download" class="btn btn-outline-secondary">
                                    <i class="bi bi-download"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
document.getElementById('promptSearch').addEventListener('input', filterPrompts);
document.getElementById('categoryFilter').addEventListener('change', filterPrompts);

function filterPrompts() {
    const search = document.getElementById('promptSearch').value.toLowerCase();
    const category = document.getElementById('categoryFilter').value;
    const rows = document.querySelectorAll('#promptsTable tbody tr');
    
    rows.forEach(row => {
        const name = row.dataset.name;
        const cat = row.dataset.category;
        const matchSearch = !search || name.includes(search);
        const matchCat = !category || cat === category;
        row.style.display = matchSearch && matchCat ? '' : 'none';
    });
}
</script>
{% endblock %}
