{% extends "base.html" %}

{% block page_title %}{{ filename }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h5 class="mb-0">{{ filename }}</h5>
    <a href="/reports" class="btn btn-outline-secondary btn-sm">
        <i class="bi bi-arrow-left me-1"></i>Volver
    </a>
</div>

<div class="card">
    <div class="card-header d-flex justify-content-between align-items-center">
        <span class="badge bg-primary-subtle text-primary">{{ prefix }}</span>
        <small class="text-muted">{{ date }} • {{ size_kb }} KB</small>
    </div>
    <div class="card-body">
        <pre class="log-entry mb-0" style="white-space: pre-wrap; font-size: 0.875rem;">{{ content }}</pre>
    </div>
    <div class="card-footer">
        <a href="/reports/{{ filename }}?download=1" class="btn btn-primary">
            <i class="bi bi-download me-1"></i>Descargar
        </a>
    </div>
</div>
{% endblock %}
