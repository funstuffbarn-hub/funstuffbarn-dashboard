name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '20'
  NORTHFLANK_PROJECT_ID: ${{ secrets.NORTHFLANK_PROJECT_ID }}

permissions:
  contents: read
  security-events: write
  actions: read
  packages: write

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install -e ".[dev]" --quiet
      
      - name: Run Ruff
        run: |
          ruff check . --output-format=github
        continue-on-error: true
      
      - name: Run MyPy
        run: |
          mypy services/
        continue-on-error: true
      
      - name: Run Black (check)
        run: |
          black --check .
        continue-on-error: true

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      GROQ_API_KEY: "test_key"
      ETSY_API_KEY: "test_key"
      ETSY_API_SECRET: "test_secret"
      ETSY_SHOP_ID: "12345"
      PRINTFUL_TOKEN: "test_token"
      PRINTFUL_STORE_ID: "12345"
      GMAIL_USER: "test@test.com"
      GMAIL_PASSWORD: "test_password"
      EMAIL_DESTINATION: "test@test.com"
      REDIS_URL: "redis://localhost:6379"
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install -e ".[dev]" --quiet
      
      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --cov=services --cov-fail-under=80 --cov-report=xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install dependencies
        run: |
          pip install -e ".[dev]" --quiet
      
      - name: Run MyPy
        run: |
          mypy services/ --ignore-missing-imports --exclude="services/agents/estrategia/tasks.py"
        continue-on-error: true

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Trivy CLI and run
        run: |
          curl -sSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin
          trivy fs --format sarif --output trivy-results.sarif .
      
      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'trivy-results.sarif'
      
      - name: Run Bandit
        id: bandit
        run: |
          pip install --upgrade pip
          pip install --upgrade --no-cache-dir "bandit>=1.7.5"
          python -m bandit --version
          python -m bandit -r services/ -f sarif -o bandit-results.sarif || true
          if [ -f bandit-results.sarif ]; then
            echo "sarif_exists=true" >> $GITHUB_OUTPUT
          else
            echo "sarif_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Upload Bandit results
        if: steps.bandit.outputs.sarif_exists == 'true'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: 'bandit-results.sarif'

  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, type-check, security]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'release'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

deploy-northflank:
    name: Deploy to Northflank
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
    env:
      NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}
      NORTHFLANK_API_BASE: "https://api.northflank.com/v1"
    steps:
      - uses: actions/checkout@v4

      - name: Get Docker image tag
        id: image-tag
        run: |
          IMAGE_TAG=${{ steps.meta.outputs.tags }}
          IMAGE=$(echo $IMAGE_TAG | cut -d',' -f1)
          echo "IMAGE=$IMAGE" >> $GITHUB_OUTPUT
          echo "Deploying image: $IMAGE"

      - name: Deploy services via Northflank API
        run: |
          set -euo pipefail
          IMAGE="${{ steps.image-tag.outputs.IMAGE }}"
          PROJECT_ID="${NORTHFLANK_PROJECT_ID}"
          API_BASE="${NORTHFLANK_API_BASE}"
          AUTH_HEADER="Authorization: Bearer ${NORTHFLANK_API_TOKEN}"
          
          # Function to trigger deployment
          deploy_service() {
            local service_name=$1
            echo "Deploying service: $service_name with image: $IMAGE"
            
            response=$(curl -s -X POST \
              -H "$AUTH_HEADER" \
              -H "Content-Type: application/json" \
              -d "{\"image\":\"$IMAGE\"}" \
              "$API_BASE/projects/$PROJECT_ID/services/$service_name/deploys")
            
            deploy_id=$(echo "$response" | jq -r '.id // empty')
            if [[ -z "$deploy_id" || "$deploy_id" == "null" ]]; then
              echo "Failed to trigger deploy for $service_name"
              echo "Response: $response"
              exit 1
            fi
            echo "Deploy triggered for $service_name (deploy_id: $deploy_id)"
            
            # Wait for deployment to complete
            echo "Waiting for deployment to complete..."
            for i in {1..60}; do
              status_response=$(curl -s -H "$AUTH_HEADER" "$API_BASE/projects/$PROJECT_ID/services/$service_name/deploys/$deploy_id")
              status=$(echo "$status_response" | jq -r '.status // empty')
              echo "  Status: $status"
              
              if [[ "$status" == "success" ]]; then
                echo "✅ Deployment successful for $service_name"
                return 0
              elif [[ "$status" == "failed" || "$status" == "cancelled" ]]; then
                echo "❌ Deployment failed for $service_name"
                echo "$status_response" | jq .
                exit 1
              fi
              sleep 10
            done
            echo "⏱ Timeout waiting for deployment"
            exit 1
          }
          
          # Deploy all services
          deploy_service "app"
          deploy_service "workers"

      - name: Verify health check
        run: |
          sleep 15
          # Get app URL from Northflank API
          response=$(curl -s -H "Authorization: Bearer ${NORTHFLANK_API_TOKEN}" \
            "https://api.northflank.com/v1/projects/${NORTHFLANK_PROJECT_ID}/services/app")
          APP_URL=$(echo "$response" | jq -r '.url // empty')
          
          if [[ -z "$APP_URL" || "$APP_URL" == "null" ]]; then
            echo "Could not get app URL from API"
            # Fallback to expected domain
            APP_URL="https://funstuffbarn-dashboard.northflank.app"
          fi
          
          echo "App URL: $APP_URL"
          for i in {1..5}; do
            if curl -sf "${APP_URL}/health" > /dev/null; then
              echo "✅ Health check PASSED"
              curl -s "${APP_URL}/health" | jq .
              exit 0
            fi
            echo "Health check attempt $i/5 failed, retrying in 10s..."
            sleep 10
          done
          echo "❌ Health check FAILED after 5 attempts"
          exit 1

  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [lint, test, type-check, security, deploy-northflank]
    if: failure() && github.repository_owner == 'funstuffbarn-hub'
    steps:
      - name: Notify on Slack
        uses: 8398a7/action-slack@v3
        with:
          status: failure
          fields: repo,message,commit,author,action,eventName,ref,workflow
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        continue-on-error: true