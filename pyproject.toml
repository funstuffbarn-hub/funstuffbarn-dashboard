# pyproject.toml - FunStuffBarn Agent-Etsy System (Phase 2 - Microservices)

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "funstuffbarn-agent-etsy"
version = "2.0.0"
description = "Sistema de agentes automatizados para FunStuffBarn Etsy - Microservicios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Core
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Async & Queue
    "celery>=5.3.0",
    "redis>=5.0.0",
    # "redis-py-cluster>=2.1.0",  # Removed: conflicts with redis>=5.0.0 (requires redis<4.0.0)
    
    # APIs
    "httpx>=0.25.0",
    "groq>=0.5.0",
    "requests>=2.31.0",
    "pytrends>=4.9.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    
    # ETSY/Printful
    "python-docx>=1.1.0",
    
    # Observability
    "prometheus-client>=0.19.0",
    "python-json-logger>=2.0.0",
    "structlog>=24.1.0",
    
    # Utils
    "python-multipart>=0.0.6",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "pytest-asyncio>=0.21.0",
    "responses>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
    "pre-commit>=3.5.0",
    "black>=23.0.0",
    "isort>=5.12.0",
]

deploy = [
    "docker>=7.0.0",
    "docker-compose>=2.20.0",
    "ansible>=8.0.0",
]

monitoring = [
    "grafana-client>=0.1.0",
    "prometheus-client>=0.19.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["services*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "W", "UP", "B", "C4", "T20"]
ignore = ["E501", "B008", "ANN001", "ANN002", "ANN003", "ANN201"]


[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/*", "scripts/*", "deploy/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers --cov=services --cov-report=term-missing --cov-fail-under=80"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "contract: Contract tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "redis: Tests requiring Redis",
    "celery: Tests requiring Celery",
    "asyncio: Tests requiring asyncio",
]

[tool.coverage.run]
source = ["services"]
omit = ["tests/*", "*/__pycache__/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true